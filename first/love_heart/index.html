<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Christmas - Advanced CV Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --white: #ffffff;
        }

        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            font-family: 'Times New Roman', serif;
        }

        #loader {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 1s;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 2px solid rgba(212, 175, 55, 0.1);
            border-top: 2px solid var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        #loader p {
            margin-top: 20px;
            color: var(--gold);
            letter-spacing: 5px;
            font-family: 'Cinzel';
            font-size: 12px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.5s;
            z-index: 10;
        }

        .ui-hidden {
            opacity: 0 !important;
        }

        h1 {
            font-family: 'Cinzel';
            font-size: clamp(32px, 5vw, 64px);
            margin-top: 5vh;
            background: linear-gradient(180deg, #fff 0%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        }

        .upload-wrapper {
            position: absolute;
            bottom: 10vh;
            pointer-events: auto;
        }

        .btn-upload {
            padding: 15px 35px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid var(--gold);
            color: var(--gold);
            cursor: pointer;
            font-family: 'Cinzel';
            font-size: 14px;
            letter-spacing: 2px;
            transition: 0.3s;
            border-radius: 2px;
        }

        .btn-upload:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .hint {
            margin-top: 15px;
            font-size: 10px;
            color: #fff;
            opacity: 0.5;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #webcam-view {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 160px;
            height: 120px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            opacity: 0.3;
            transform: scaleX(-1);
            border-radius: 8px;
            overflow: hidden;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>AWAKENING THE TREE</p>
    </div>

    <div id="ui-layer">
        <h1>Merry Christmas</h1>
        <div class="upload-wrapper">
            <input type="file" id="file-input" hidden accept="image/*" multiple>
            <button class="btn-upload" onclick="document.getElementById('file-input').click()">ADD MEMORIES</button>
            <div class="hint">Pinch to Focus • Fist to Form Tree • Open to Scatter</div>
        </div>
    </div>

    <div id="webcam-view"><video id="webcam" autoplay playsinline></video></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { HandLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

        const STATE = {
            mode: 'TREE', // TREE, SCATTER, FOCUS
            targetRot: { x: 0, y: 0 },
            focusedPhoto: null,
            transitionSpeed: 0.08
        };

        class RealisticScene {
            constructor() {
                this.container = new THREE.Group();
                this.particles = [];
                this.init();
                this.createLights();
                this.createObjects();
                this.animate();
            }

            init() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 5, 60);

                this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(window.devicePixelRatio);
                this.renderer.toneMapping = THREE.ReinhardToneMapping;
                document.body.appendChild(this.renderer.domElement);

                this.composer = new EffectComposer(this.renderer);
                this.composer.addPass(new RenderPass(this.scene, this.camera));
                this.composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.4, 0.85));

                this.scene.add(this.container);
                window.addEventListener('resize', () => this.onResize());

                // Keyboard Toggle
                window.addEventListener('keydown', (e) => {
                    if (e.key.toLowerCase() === 'h') document.getElementById('ui-layer').classList.toggle('ui-hidden');
                });
            }

            createLights() {
                const amb = new THREE.AmbientLight(0xffffff, 0.4);
                const point = new THREE.PointLight(0xffccaa, 1000);
                point.position.set(0, 10, 10);
                const spotGold = new THREE.SpotLight(0xd4af37, 2000);
                spotGold.position.set(20, 40, 20);
                this.scene.add(amb, point, spotGold);
            }

            createObjects() {
                this.mats = {
                    gold: new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.1 }),
                    needle: new THREE.MeshStandardMaterial({ color: 0x0a2a12, metalness: 0.2, roughness: 0.8 }),
                    red: new THREE.MeshPhysicalMaterial({ color: 0x990000, clearcoat: 1.0 })
                };

                // Add Base Particles (Ornaments & Leaves)
                for (let i = 0; i < 1500; i++) {
                    const isSpecial = Math.random() > 0.8;
                    const geo = isSpecial ? new THREE.SphereGeometry(0.4, 8, 8) : new THREE.BoxGeometry(0.3, 0.3, 0.3);
                    const mat = isSpecial ? (Math.random() > 0.5 ? this.mats.gold : this.mats.red) : this.mats.needle;
                    const mesh = new THREE.Mesh(geo, mat);
                    this.registerParticle(mesh, 'DECO');
                }

                // Add Dust
                const dustGeo = new THREE.SphereGeometry(0.05, 4, 4);
                const dustMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                for (let i = 0; i < 2000; i++) {
                    const m = new THREE.Mesh(dustGeo, dustMat);
                    this.registerParticle(m, 'DUST');
                }
            }

            registerParticle(mesh, type) {
                const data = {
                    mesh, type,
                    targetPos: new THREE.Vector3(),
                    targetRot: new THREE.Euler(),
                    targetScale: 1,
                    noise: Math.random() * 20
                };
                this.container.add(mesh);
                this.particles.push(data);
            }

            async addPhoto(file) {
                const loader = new THREE.TextureLoader();
                const texture = await loader.loadAsync(URL.createObjectURL(file));
                texture.colorSpace = THREE.SRGBColorSpace;

                const group = new THREE.Group();
                const frame = new THREE.Mesh(new THREE.BoxGeometry(8.4, 6.4, 0.2), this.mats.gold);
                const pic = new THREE.Mesh(new THREE.BoxGeometry(8, 6, 0.25), new THREE.MeshBasicMaterial({ map: texture }));
                pic.position.z = 0.05;
                group.add(frame, pic);

                const data = {
                    mesh: group, type: 'PHOTO',
                    targetPos: new THREE.Vector3(),
                    targetRot: new THREE.Euler(),
                    targetScale: 0.1, // Initial
                    noise: Math.random() * 10
                };
                this.container.add(group);
                this.particles.push(data);
            }

            updatePositions(time) {
                const photos = this.particles.filter(p => p.type === 'PHOTO');
                const decos = this.particles.filter(p => p.type === 'DECO');

                this.particles.forEach((p, i) => {
                    // --- 1. TREE MODE: Improved Conical Algorithm ---
                    if (STATE.mode === 'TREE') {
                        if (p.type !== 'DUST') {
                            const ratio = i / this.particles.length;
                            const height = 35;
                            const y = (ratio * height) - 15;

                            // Create tiered effect (Christmas tree layers)
                            const layerFreq = 5.0;
                            const tier = Math.floor(ratio * layerFreq) / layerFreq;
                            const baseRadius = (1 - ratio) * 15;
                            const radialNoise = Math.sin(ratio * 100) * 1.5;
                            const radius = baseRadius + radialNoise;

                            const angle = ratio * Math.PI * 60;
                            p.targetPos.set(Math.cos(angle) * radius, y, Math.sin(angle) * radius);
                            p.targetScale = (p.type === 'PHOTO') ? 0.35 : 1.0;
                            p.targetRot.set(0, angle, 0);
                        } else {
                            // Dust drifting around the tree
                            const t = time * 0.001 + p.noise;
                            p.targetPos.set(Math.cos(t) * 20, Math.sin(t * 0.5) * 30, Math.sin(t) * 20);
                        }
                    }
                    // --- 2. SCATTER MODE ---
                    else if (STATE.mode === 'SCATTER') {
                        const t = time * 0.0005 + p.noise;
                        const r = 25 + Math.sin(t) * 5;
                        p.targetPos.set(Math.cos(t * 1.2) * r, Math.sin(t * 1.5) * r, Math.sin(t * 0.8) * r);
                        p.targetScale = (p.type === 'PHOTO') ? 0.8 : 1.0;
                        p.targetRot.set(t, t, t);
                    }
                    // --- 3. FOCUS MODE ---
                    else if (STATE.mode === 'FOCUS') {
                        if (!STATE.focusedPhoto && photos.length > 0) STATE.focusedPhoto = photos[Math.floor(Math.random() * photos.length)];

                        if (p === STATE.focusedPhoto) {
                            p.targetPos.set(0, 0, 35);
                            p.targetScale = 4.0;
                            p.targetRot.set(0, 0, 0);
                        } else {
                            // Hide others
                            const angle = (i / this.particles.length) * Math.PI * 2;
                            p.targetPos.set(Math.cos(angle) * 50, Math.sin(angle) * 50, -30);
                            p.targetScale = 0.1;
                        }
                    }

                    // Smooth LERP
                    p.mesh.position.lerp(p.targetPos, STATE.transitionSpeed);
                    p.mesh.scale.setScalar(THREE.MathUtils.lerp(p.mesh.scale.x, p.targetScale, STATE.transitionSpeed));
                    p.mesh.quaternion.slerp(new THREE.Quaternion().setFromEuler(p.targetRot), STATE.transitionSpeed);
                });

                // Camera/Container rotation based on Hand
                this.container.rotation.y = THREE.MathUtils.lerp(this.container.rotation.y, STATE.targetRot.y * 1.5, 0.05);
                this.container.rotation.x = THREE.MathUtils.lerp(this.container.rotation.x, STATE.targetRot.x * 1.5, 0.05);
            }

            onResize() {
                this.camera.aspect = window.innerWidth / window.innerHeight;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.composer.setSize(window.innerWidth, window.innerHeight);
            }

            animate() {
                requestAnimationFrame((t) => this.animate(t));
                this.updatePositions(performance.now());
                this.composer.render();
            }
        }

        // --- Gesture Intelligence ---
        async function setupCV(app) {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            const landmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: { modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`, delegate: "GPU" },
                runningMode: "VIDEO", numHands: 1
            });

            const video = document.getElementById('webcam');
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;

            async function detect() {
                const results = landmarker.detectForVideo(video, performance.now());
                if (results.landmarks && results.landmarks[0]) {
                    const lm = results.landmarks[0];
                    // Logic: Distances to Wrist (lm[0])
                    const getDist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
                    const isExtended = (idx) => getDist(lm[idx], lm[0]) > 0.35;

                    const extendedCount = [8, 12, 16, 20].filter(isExtended).length;
                    const pinch = getDist(lm[4], lm[8]);

                    // Switch Modes
                    if (pinch < 0.04) {
                        if (STATE.mode !== 'FOCUS') { STATE.mode = 'FOCUS'; STATE.focusedPhoto = null; }
                    } else if (extendedCount <= 1) {
                        STATE.mode = 'TREE';
                    } else if (extendedCount >= 3) {
                        STATE.mode = 'SCATTER';
                    }

                    STATE.targetRot.y = (lm[9].x - 0.5) * 2; // Hand mapping
                    STATE.targetRot.x = (lm[9].y - 0.5) * 1;
                }
                requestAnimationFrame(detect);
            }
            video.addEventListener('loadeddata', () => {
                detect();
                document.getElementById('loader').style.opacity = 0;
                setTimeout(() => document.getElementById('loader').remove(), 1000);
            });
        }

        // --- Start ---
        const app = new RealisticScene();
        setupCV(app);

        document.getElementById('file-input').addEventListener('change', (e) => {
            Array.from(e.target.files).forEach(file => app.addPhoto(file));
        });
    </script>
</body>

</html>
