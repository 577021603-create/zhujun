<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree</title>
    
    <!-- 引入Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', serif;
            background-color: #000000;
            overflow: hidden;
            color: #d4af37;
        }

        /* 加载界面 */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 1s ease-out;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-top: 1px solid #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 主标题 */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 56px;
            text-align: center;
            margin-top: 20px;
            background: linear-gradient(to right, #ffffff, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            z-index: 10;
        }

        /* 上传组件 */
        .upload-wrapper {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .upload-btn {
            background: rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 15px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .upload-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        #fileInput {
            display: none;
        }

        .hint-text {
            color: #fceea7;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }

        /* 摄像头和画布 */
        #webcamContainer {
            position: fixed;
            bottom: 10px;
            right: 10px;
            opacity: 0;
            z-index: 5;
        }

        #webcamVideo {
            width: 160px;
            height: 120px;
            display: block;
        }

        #handCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 160px;
            height: 120px;
            display: block;
        }

        /* 隐藏UI类 */
        .ui-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        /* 3D画布容器 */
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>

    <script type="importmap">
        {
          "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
          }
        }
    </script>
</head>
<body>
    <!-- 加载界面 -->
    <div id="loader">
        <div class="spinner"></div>
        <p>LOADING HOLIDAY MAGIC</p>
    </div>

    <!-- 主标题 -->
    <h1>Merry Christmas</h1>

    <!-- 上传组件 -->
    <div class="upload-wrapper">
        <button class="upload-btn" id="uploadBtn">ADD MEMORIES</button>
        <input type="file" id="fileInput" accept="image/*">
        <p class="hint-text">Press 'H' to Hide Controls</p>
    </div>

    <!-- 摄像头容器 -->
    <div id="webcamContainer">
        <video id="webcamVideo" autoplay playsinline></video>
        <canvas id="handCanvas" width="160" height="120"></canvas>
    </div>

    <!-- 3D画布容器 -->
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { PMREMGenerator } from 'three/addons/pmrem/PMREMGenerator.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';
        import { HandLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

        // 全局状态
        const STATE = {
            mode: 'TREE', // TREE, SCATTER, FOCUS
            handGesture: null,
            targetPhoto: null
        };

        // 初始化Three.js场景
        let scene, camera, renderer, composer;
        let particles = [];
        let mainGroup;
        let pointLight, spotLight1, spotLight2;

        // 初始化粒子系统
        function initParticles() {
            // 创建主群组
            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            // 粒子总数
            const particleCount = 1500;
            const dustCount = 2500;

            // 创建主要粒子
            for (let i = 0; i < particleCount; i++) {
                createParticle(i, particleCount);
            }

            // 创建尘埃粒子
            for (let i = 0; i < dustCount; i++) {
                createDustParticle(i, dustCount);
            }
            
            updateParticles();
        }

        // 创建单个粒子
        function createParticle(index, total) {
            const t = index / total;
            const geometryType = Math.floor(Math.random() * 3);
            let geometry, material;
            
            // 随机选择几何体类型
            switch(geometryType) {
                case 0: // Box
                    geometry = new THREE.BoxGeometry(
                        0.5 + Math.random() * 0.5,
                        0.5 + Math.random() * 0.5,
                        0.5 + Math.random() * 0.5
                    );
                    material = new THREE.MeshStandardMaterial({
                        color: Math.random() > 0.5 ? new THREE.Color(0xd4af37) : new THREE.Color(0x006400),
                        metalness: 0.7,
                        roughness: 0.3
                    });
                    break;
                    
                case 1: // Sphere
                    geometry = new THREE.SphereGeometry(
                        0.3 + Math.random() * 0.4,
                        8,
                        8
                    );
                    material = new THREE.MeshPhysicalMaterial({
                        color: Math.random() > 0.5 ? new THREE.Color(0xd4af37) : new THREE.Color(0xff0000),
                        metalness: 0.5,
                        roughness: 0.2,
                        clearcoat: Math.random() > 0.5 ? 0.8 : 0
                    });
                    break;
                    
                case 2: // Candy Cane
                    const curve = new THREE.CatmullRomCurve3([
                        new THREE.Vector3(0, -0.8, 0),
                        new THREE.Vector3(0.1, -0.6, 0),
                        new THREE.Vector3(0, -0.4, 0),
                        new THREE.Vector3(-0.1, -0.2, 0),
                        new THREE.Vector3(0, 0, 0),
                        new THREE.Vector3(0.1, 0.2, 0),
                        new THREE.Vector3(0, 0.4, 0),
                        new THREE.Vector3(-0.1, 0.6, 0),
                        new THREE.Vector3(0, 0.8, 0)
                    ]);
                    geometry = new THREE.TubeGeometry(curve, 64, 0.1, 8, false);
                    
                    // 创建糖果手杖纹理
                    const canvas = document.createElement('canvas');
                    canvas.width = 64;
                    canvas.height = 256;
                    const ctx = canvas.getContext('2d');
                    
                    // 白底
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // 红色斜条纹
                    ctx.strokeStyle = '#FF0000';
                    ctx.lineWidth = 8;
                    for (let y = 0; y < canvas.height; y += 20) {
                        ctx.beginPath();
                        ctx.moveTo(0, y);
                        ctx.lineTo(canvas.width, y + 20);
                        ctx.stroke();
                        
                        ctx.beginPath();
                        ctx.moveTo(0, y + 10);
                        ctx.lineTo(canvas.width, y + 30);
                        ctx.stroke();
                    }
                    
                    const texture = new THREE.CanvasTexture(canvas);
                    material = new THREE.MeshStandardMaterial({
                        map: texture,
                        metalness: 0.3,
                        roughness: 0.4
                    });
                    break;
            }
            
            const mesh = new THREE.Mesh(geometry, material);
            
            // 添加默认位置属性
            mesh.userData.originalPosition = new THREE.Vector3();
            mesh.userData.targetPosition = new THREE.Vector3();
            mesh.userData.velocity = new THREE.Vector3(
                (Math.random() - 0.5) * 0.1,
                (Math.random() - 0.5) * 0.1,
                (Math.random() - 0.5) * 0.1
            );
            mesh.userData.rotationSpeed = new THREE.Vector3(
                (Math.random() - 0.5) * 0.02,
                (Math.random() - 0.5) * 0.02,
                (Math.random() - 0.5) * 0.02
            );
            mesh.userData.type = geometryType === 2 ? 'CANDY' : 'PARTICLE';
            
            mainGroup.add(mesh);
            particles.push(mesh);
        }

        // 创建尘埃粒子
        function createDustParticle(index, total) {
            const geometry = new THREE.SphereGeometry(0.05 + Math.random() * 0.1, 4, 4);
            const material = new THREE.MeshBasicMaterial({
                color: new THREE.Color(Math.random(), Math.random(), Math.random()),
                transparent: true,
                opacity: 0.7
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            
            // 随机初始位置
            mesh.position.set(
                (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 100,
                (Math.random() - 0.5) * 100
            );
            
            mesh.userData.originalPosition = mesh.position.clone();
            mesh.userData.targetPosition = mesh.position.clone();
            mesh.userData.type = 'DUST';
            
            mainGroup.add(mesh);
            particles.push(mesh);
        }

        // 创建照片粒子
        function createPhotoParticle(texture) {
            // 照片几何体
            const photoGeometry = new THREE.PlaneGeometry(4, 3);
            const photoMaterial = new THREE.MeshBasicMaterial({ 
                map: texture,
                side: THREE.DoubleSide
            });
            const photoMesh = new THREE.Mesh(photoGeometry, photoMaterial);
            
            // 相框几何体
            const frameGeometry = new THREE.BoxGeometry(4.2, 3.2, 0.2);
            const frameMaterial = new THREE.MeshStandardMaterial({
                color: new THREE.Color(0xd4af37),
                metalness: 0.8,
                roughness: 0.2
            });
            const frameMesh = new THREE.Mesh(frameGeometry, frameMaterial);
            
            // 将照片和相框组合
            const photoGroup = new THREE.Group();
            photoGroup.add(photoMesh);
            photoGroup.add(frameMesh);
            photoGroup.userData.type = 'PHOTO';
            photoGroup.userData.originalPosition = new THREE.Vector3();
            photoGroup.userData.targetPosition = new THREE.Vector3();
            photoGroup.userData.texture = texture;
            
            mainGroup.add(photoGroup);
            particles.push(photoGroup);
            
            return photoGroup;
        }

        // 更新所有粒子位置
        function updateParticles() {
            const time = Date.now() * 0.001;
            
            particles.forEach((particle, index) => {
                // 根据当前模式计算目标位置
                let targetPos = new THREE.Vector3();
                
                if (STATE.mode === 'TREE') {
                    // 树模式：螺旋圆锥体
                    const t = index / particles.length;
                    const maxRadius = 20;
                    const radius = maxRadius * (1 - t);
                    const angle = t * 50 * Math.PI;
                    
                    targetPos.x = radius * Math.cos(angle);
                    targetPos.z = radius * Math.sin(angle);
                    targetPos.y = t * 30 - 15;
                } else if (STATE.mode === 'SCATTER') {
                    // 散落模式：随机球形分布
                    const radius = 8 + Math.random() * 12;
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    
                    targetPos.x = radius * Math.sin(phi) * Math.cos(theta);
                    targetPos.y = radius * Math.sin(phi) * Math.sin(theta);
                    targetPos.z = radius * Math.cos(phi);
                    
                    // 自转效果
                    if (particle.userData.rotationSpeed) {
                        particle.rotation.x += particle.userData.rotationSpeed.x;
                        particle.rotation.y += particle.userData.rotationSpeed.y;
                        particle.rotation.z += particle.userData.rotationSpeed.z;
                    }
                } else if (STATE.mode === 'FOCUS') {
                    // 聚焦模式：选中的照片移到前面，其他散开
                    if (particle.userData.type === 'PHOTO' && particle === STATE.targetPhoto) {
                        targetPos.set(0, 2, 35);
                        particle.scale.lerp(new THREE.Vector3(4.5, 4.5, 4.5), 0.1);
                    } else {
                        const t = index / particles.length;
                        const radius = 15 + Math.random() * 10;
                        const theta = Math.random() * Math.PI * 2;
                        
                        targetPos.x = radius * Math.cos(theta);
                        targetPos.z = radius * Math.sin(theta);
                        targetPos.y = (Math.random() - 0.5) * 20;
                        
                        particle.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                    }
                }
                
                // 平滑移动到目标位置
                particle.userData.targetPosition.copy(targetPos);
                particle.position.lerp(particle.userData.targetPosition, 0.05);
            });
        }

        // 初始化场景
        async function init() {
            // 创建场景
            scene = new THREE.Scene();
            
            // 创建相机
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 2, 50);
            
            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.toneMappingExposure = 2.2;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // 创建环境
            const pmremGenerator = new PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();
            
            const environment = new RoomEnvironment(renderer);
            const envMap = pmremGenerator.fromScene(environment).texture;
            
            scene.environment = envMap;
            scene.background = new THREE.Color(0x000000);
            
            // 添加光照
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            pointLight = new THREE.PointLight(0xffa500, 2, 100);
            pointLight.position.set(0, 10, 0);
            scene.add(pointLight);
            
            spotLight1 = new THREE.SpotLight(0xd4af37, 1200, 100, Math.PI / 4, 0.5, 1.0);
            spotLight1.position.set(30, 40, 40);
            spotLight1.castShadow = true;
            scene.add(spotLight1);
            
            spotLight2 = new THREE.SpotLight(0x0000ff, 600, 100, Math.PI / 4, 0.5, 1.0);
            spotLight2.position.set(-30, 20, -30);
            spotLight2.castShadow = true;
            scene.add(spotLight2);
            
            // 初始化粒子
            initParticles();
            
            // 创建后期处理
            composer = new EffectComposer(renderer);
            composer.addPass(new RenderPass(scene, camera));
            
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5,
                0.4,
                0.85
            );
            bloomPass.threshold = 0.7;
            bloomPass.strength = 0.45;
            bloomPass.radius = 0.4;
            composer.addPass(bloomPass);
            
            // 添加默认照片
            createDefaultPhoto();
            
            // 完成加载
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loader').style.display = 'none';
                }, 1000);
            }, 2000);
            
            // 开始动画循环
            animate();
        }

        // 创建默认照片
        function createDefaultPhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 384;
            const ctx = canvas.getContext('2d');
            
            // 背景
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 文字
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#d4af37';
            ctx.fillText('JOYEUX NOEL', canvas.width/2, canvas.height/2);
            
            // 装饰
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2 - 50, 30, 0, Math.PI * 2);
            ctx.fillStyle = '#ff0000';
            ctx.fill();
            
            const texture = new THREE.CanvasTexture(canvas);
            createPhotoParticle(texture);
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            // 更新粒子
            updateParticles();
            
            // 渲染场景
            composer.render();
        }

        // 处理窗口大小变化
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('resize', onWindowResize);

        // UI控制
        document.getElementById('uploadBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (ev) => {
                new THREE.TextureLoader().load(ev.target.result, (texture) => {
                    texture.colorSpace = THREE.SRGBColorSpace;
                    createPhotoParticle(texture);
                });
            };
            reader.readAsDataURL(file);
        });

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') {
                document.querySelector('.upload-wrapper').classList.toggle('ui-hidden');
                document.querySelector('h1').classList.toggle('ui-hidden');
                document.querySelector('.hint-text').classList.toggle('ui-hidden');
            }
        });

        // 初始化MediaPipe手势识别
        async function initializeHandTracking() {
            try {
                const filesetResolver = await FilesetResolver.forVisionTasks(
                    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm'
                );
                
                const handLandmarker = await HandLandmarker.createFromOptions(filesetResolver, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 2
                });
                
                const video = document.getElementById('webcamVideo');
                const canvas = document.getElementById('handCanvas');
                const ctx = canvas.getContext('2d');
                
                // 启动摄像头
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ 
                            video: { width: 160, height: 120 } 
                        });
                        video.srcObject = stream;
                        
                        video.onloadedmetadata = () => {
                            video.play();
                            
                            // 开始手势检测
                            detectHands(handLandmarker, video, ctx);
                        };
                    } catch (err) {
                        console.error("Error accessing webcam: ", err);
                    }
                }
            } catch (error) {
                console.error("Failed to initialize hand tracking:", error);
            }
        }

        // 手势检测函数
        async function detectHands(handLandmarker, video, ctx) {
            const startTimeMs = performance.now();
            
            const detect = async () => {
                if (video.readyState >= 2) { // HAVE_CURRENT_DATA
                    // 清除画布
                    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                    
                    try {
                        // 检测手势
                        const results = handLandmarker.detectForVideo(video, performance.now());
                        
                        // 处理每只手
                        if (results.landmarks) {
                            for (const landmarks of results.landmarks) {
                                // 绘制手部关键点
                                drawHand(landmarks, ctx);
                                
                                // 分析手势
                                const gesture = analyzeGesture(landmarks);
                                
                                // 根据手势更新模式
                                if (gesture === 'PINCH' && STATE.mode !== 'FOCUS') {
                                    STATE.mode = 'FOCUS';
                                    // 随机选择一张照片作为焦点
                                    const photos = particles.filter(p => p.userData.type === 'PHOTO');
                                    if (photos.length > 0) {
                                        STATE.targetPhoto = photos[Math.floor(Math.random() * photos.length)];
                                    }
                                } else if (gesture === 'FIST' && STATE.mode !== 'TREE') {
                                    STATE.mode = 'TREE';
                                } else if (gesture === 'OPEN_HAND' && STATE.mode !== 'SCATTER') {
                                    STATE.mode = 'SCATTER';
                                }
                                
                                // 使用掌心位置控制场景旋转
                                if (landmarks[9]) { // Landmark 9 is the palm center
                                    const palmX = landmarks[9][0] / ctx.canvas.width;
                                    const palmY = landmarks[9][1] / ctx.canvas.height;
                                    
                                    // 映射到旋转角度 (-Math.PI to Math.PI)
                                    mainGroup.rotation.y = (palmX - 0.5) * Math.PI;
                                    mainGroup.rotation.x = (palmY - 0.5) * Math.PI;
                                }
                            }
                        }
                    } catch (error) {
                        console.error("Error during hand detection:", error);
                    }
                }
                
                requestAnimationFrame(detect);
            };
            
            detect();
        }

        // 绘制手部关键点
        function drawHand(landmarks, ctx) {
            // 绘制连接线
            const connections = [
                [0, 1], [1, 2], [2, 3], [3, 4], // 拇指
                [0, 5], [5, 6], [6, 7], [7, 8], // 食指
                [0, 9], [9, 10], [10, 11], [11, 12], // 中指
                [0, 13], [13, 14], [14, 15], [15, 16], // 无名指
                [0, 17], [17, 18], [18, 19], [19, 20] // 小指
            ];
            
            ctx.strokeStyle = '#d4af37';
            ctx.lineWidth = 2;
            
            for (const [start, end] of connections) {
                const startPt = landmarks[start];
                const endPt = landmarks[end];
                
                ctx.beginPath();
                ctx.moveTo(startPt[0], startPt[1]);
                ctx.lineTo(endPt[0], endPt[1]);
                ctx.stroke();
            }
            
            // 绘制关键点
            ctx.fillStyle = '#ff0000';
            for (const landmark of landmarks) {
                ctx.beginPath();
                ctx.arc(landmark[0], landmark[1], 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 分析手势
        function analyzeGesture(landmarks) {
            // 获取关键点
            const thumbTip = landmarks[4];   // 拇指尖
            const indexTip = landmarks[8];   // 食指尖
            const middleTip = landmarks[12]; // 中指尖
            const ringTip = landmarks[16];   // 无名指尖
            const pinkyTip = landmarks[20];  // 小指尖
            const wrist = landmarks[0];      // 手腕
            
            // 计算食指和拇指之间的距离（用于检测捏合）
            const pinchDistance = Math.sqrt(
                Math.pow(thumbTip[0] - indexTip[0], 2) +
                Math.pow(thumbTip[1] - indexTip[1], 2)
            );
            
            // 归一化距离（相对于手掌大小）
            const wristToMiddle = Math.sqrt(
                Math.pow(wrist[0] - landmarks[9][0], 2) +
                Math.pow(wrist[1] - landmarks[9][1], 2)
            );
            
            const normalizedPinchDist = pinchDistance / wristToMiddle;
            
            // 检测捏合手势
            if (normalizedPinchDist < 0.05) {
                return 'PINCH';
            }
            
            // 计算四指到手腕的平均距离（用于检测握拳和张开）
            const fingerTips = [indexTip, middleTip, ringTip, pinkyTip];
            let avgFingerWristDist = 0;
            
            for (const tip of fingerTips) {
                const dist = Math.sqrt(
                    Math.pow(tip[0] - wrist[0], 2) +
                    Math.pow(tip[1] - wrist[1], 2)
                );
                avgFingerWristDist += dist;
            }
            
            avgFingerWristDist /= fingerTips.length;
            const normalizedAvgDist = avgFingerWristDist / wristToMiddle;
            
            // 检测握拳（手指靠近手腕）
            if (normalizedAvgDist < 0.25) {
                return 'FIST';
            }
            
            // 检测张开（手指远离手腕）
            if (normalizedAvgDist > 0.4) {
                return 'OPEN_HAND';
            }
            
            return 'UNKNOWN';
        }

        // 启动应用
        init();
        
        // 初始化手势跟踪
        setTimeout(initializeHandTracking, 1000);
    </script>
