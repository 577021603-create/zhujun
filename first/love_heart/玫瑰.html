<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Magic - Aura Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #d4af37; --cream: #fceea7; }
        body { margin: 0; background: #000; color: white; font-family: 'Times New Roman', serif; overflow: hidden; }

        /* 1. UI 设计与 CSS 样式 */
        #loader {
            position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 1000; transition: opacity 1s ease;
        }
        .spinner {
            width: 40px; height: 40px; border: 2px solid rgba(212, 175, 55, 0.1);
            border-top: 1px solid var(--gold); border-radius: 50%; animation: spin 1s linear infinite;
        }
        #loader p { margin-top: 20px; font-family: 'Cinzel'; font-size: 14px; color: var(--gold); letter-spacing: 2px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        #ui-container {
            position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column;
            align-items: center; transition: opacity 0.5s ease; z-index: 100;
        }
        .ui-hidden { opacity: 0; pointer-events: none; }

        h1 {
            font-family: 'Cinzel', serif; font-size: 56px; margin-top: 50px;
            background: linear-gradient(to bottom, #ffffff, var(--gold));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4));
        }

        .upload-wrapper { position: absolute; bottom: 80px; pointer-events: auto; text-align: center; }
        .btn-upload {
            padding: 15px 30px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px);
            border: 1px solid var(--gold); color: var(--gold); cursor: pointer; font-family: 'Cinzel';
            letter-spacing: 2px; transition: 0.3s;
        }
        .btn-upload:hover { background: var(--gold); color: #000; }
        .hint { margin-top: 15px; font-size: 12px; color: var(--cream); opacity: 0.8; }

        #webcam-container { position: absolute; bottom: 10px; right: 10px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p>LOADING HOLIDAY MAGIC</p>
    </div>

    <div id="ui-container">
        <h1>Merry Christmas</h1>
        <div class="upload-wrapper">
            <button class="btn-upload" id="upload-btn">ADD MEMORIES</button>
            <input type="file" id="photo-input" hidden accept="image/*" multiple>
            <div class="hint">Press 'H' to Hide Controls • Gestures: Pinch, Fist, Open</div>
        </div>
    </div>

    <div id="webcam-container">
        <video id="webcam" autoplay playsinline width="160" height="120"></video>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { HandLandmarker, FilesetResolver } from '@mediapipe/tasks-vision';

        // --- 全局状态机 ---
        const STATE = {
            mode: 'TREE',
            targetRotation: new THREE.Euler(),
            focusedPhoto: null,
            time: 0
        };

        class Decoration {
            constructor(mesh, type) {
                this.mesh = mesh;
                this.type = type;
                this.targetPos = new THREE.Vector3();
                this.targetScale = 1;
                this.rotVel = new THREE.Vector3(Math.random()*0.05, Math.random()*0.05, Math.random()*0.05);
            }
            update() {
                this.mesh.position.lerp(this.targetPos, 0.08);
                const s = THREE.MathUtils.lerp(this.mesh.scale.x, this.targetScale, 0.1);
                this.mesh.scale.set(s, s, s);
                if (STATE.mode === 'SCATTER') {
                    this.mesh.rotation.x += this.rotVel.x;
                    this.mesh.rotation.y += this.rotVel.y;
                }
            }
        }

        class ChristmasScene {
            constructor() {
                this.initThree();
                this.initPost();
                this.initLights();
                this.createAura();
                this.createContent();
                this.setupInteraction();
                this.animate();
            }

            initThree() {
                this.scene = new THREE.Scene();
                this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
                this.camera.position.set(0, 2, 50);

                this.renderer = new THREE.WebGLRenderer({ antialias: true });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.toneMapping = THREE.ReinhardToneMapping;
                this.renderer.toneMappingExposure = 2.2;
                document.body.appendChild(this.renderer.domElement);

                const pmrem = new THREE.PMREMGenerator(this.renderer);
                this.scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

                this.mainGroup = new THREE.Group();
                this.scene.add(this.mainGroup);
            }

            initPost() {
                this.composer = new EffectComposer(this.renderer);
                this.composer.addPass(new RenderPass(this.scene, this.camera));
                this.bloomPass = new UnrealBloomPass(
                    new THREE.Vector2(window.innerWidth, window.innerHeight),
                    0.45, 0.4, 0.7
                );
                this.composer.addPass(this.bloomPass);
            }

            initLights() {
                this.scene.add(new THREE.AmbientLight(0xffffff, 0.6));
                const pLight = new THREE.PointLight(0xffaa44, 2);
                pLight.position.set(0, 5, 0);
                this.scene.add(pLight);

                const spot1 = new THREE.SpotLight(0xd4af37, 1200);
                spot1.position.set(30, 40, 40);
                this.scene.add(spot1);

                const spot2 = new THREE.SpotLight(0x4488ff, 600);
                spot2.position.set(-30, 20, -30);
                this.scene.add(spot2);
            }

            // 新增：周围的光环系统
            createAura() {
                this.auraGroup = new THREE.Group();
                this.mainGroup.add(this.auraGroup);

                const ringGeo = new THREE.TorusGeometry(22, 0.05, 16, 100);
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xd4af37, transparent: true, opacity: 0.3 });

                for(let i=0; i<3; i++) {
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2;
                    ring.scale.set(1 + i*0.2, 1 + i*0.2, 1);
                    this.auraGroup.add(ring);
                }
            }

            createContent() {
                const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.9, roughness: 0.1 });
                const greenMat = new THREE.MeshStandardMaterial({ color: 0x013220, metalness: 0.5, roughness: 0.4 });
                const redMat = new THREE.MeshPhysicalMaterial({ color: 0x8b0000, clearcoat: 1.0, metalness: 0.3 });

                // 程序化生成糖果手杖纹理
                const canvas = document.createElement('canvas');
                canvas.width = 128; canvas.height = 128;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,128,128);
                ctx.strokeStyle = '#cc0000'; ctx.lineWidth = 25;
                for(let i=0; i<4; i++) {
                    ctx.beginPath(); ctx.moveTo(-20 + i*40, 0); ctx.lineTo(100 + i*40, 128); ctx.stroke();
                }
                const candyTex = new THREE.CanvasTexture(canvas);
                candyTex.wrapS = candyTex.wrapT = THREE.RepeatWrapping;
                candyTex.repeat.set(4, 1);
                const candyMat = new THREE.MeshStandardMaterial({ map: candyTex });

                this.decorations = [];

                // 1500 主体粒子
                for (let i = 0; i < 1500; i++) {
                    let geo, mat;
                    const r = Math.random();
                    if (r < 0.35) {
                        geo = new THREE.BoxGeometry(0.7, 0.7, 0.7);
                        mat = Math.random() > 0.4 ? goldMat : greenMat;
                    } else if (r < 0.7) {
                        geo = new THREE.SphereGeometry(0.45, 16, 16);
                        mat = Math.random() > 0.5 ? goldMat : redMat;
                    } else {
                        const curve = new THREE.CatmullRomCurve3([
                            new THREE.Vector3(0,0,0), new THREE.Vector3(0,1.5,0),
                            new THREE.Vector3(0.5,2,0), new THREE.Vector3(1,1.5,0)
                        ]);
                        geo = new THREE.TubeGeometry(curve, 20, 0.12, 8, false);
                        mat = candyMat;
                    }
                    const m = new THREE.Mesh(geo, mat);
                    this.decorations.push(new Decoration(m, 'DECO'));
                    this.mainGroup.add(m);
                }

                // 2500 尘埃粒子
                const dustGeo = new THREE.DodecahedronGeometry(0.08);
                const dustMat = new THREE.MeshBasicMaterial({ color: 0xfceea7, transparent: true, opacity: 0.4 });
                for (let i = 0; i < 2500; i++) {
                    const m = new THREE.Mesh(dustGeo, dustMat);
                    this.decorations.push(new Decoration(m, 'DUST'));
                    this.mainGroup.add(m);
                }

                this.addPhotoToScene(null, "JOYEUX NOEL");
            }

            addPhotoToScene(texture, text = "") {
                const group = new THREE.Group();
                const frame = new THREE.Mesh(new THREE.BoxGeometry(10.5, 8.5, 0.6), new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.8 }));

                let tex = texture;
                if(!tex) {
                    const c = document.createElement('canvas');
                    c.width = 512; c.height = 384;
                    const ctx = c.getContext('2d');
                    ctx.fillStyle = '#050505'; ctx.fillRect(0,0,512,384);
                    ctx.fillStyle = '#d4af37'; ctx.font = 'bold 45px Cinzel'; ctx.textAlign = 'center';
                    ctx.fillText(text, 256, 210);
                    tex = new THREE.CanvasTexture(c);
                }

                const photo = new THREE.Mesh(new THREE.PlaneGeometry(9.5, 7.5), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
                photo.position.z = 0.31;
                group.add(frame, photo);

                const deco = new Decoration(group, 'PHOTO');
                this.decorations.push(deco);
                this.mainGroup.add(group);
            }

            setupInteraction() {
                const btn = document.getElementById('upload-btn');
                const input = document.getElementById('photo-input');
                btn.onclick = () => input.click();

                input.onchange = (e) => {
                    const files = e.target.files;
                    for (let f of files) {
                        const reader = new FileReader();
                        reader.onload = (ev) => {
                            new THREE.TextureLoader().load(ev.target.result, (t) => {
                                t.colorSpace = THREE.SRGBColorSpace; // 关键色彩空间
                                this.addPhotoToScene(t);
                            });
                        }
                        reader.readAsDataURL(f);
                    }
                };

                window.addEventListener('keydown', (e) => {
                    if (e.key.toLowerCase() === 'h') document.getElementById('ui-container').classList.toggle('ui-hidden');
                });
            }

            updateLayout() {
                const photos = this.decorations.filter(d => d.type === 'PHOTO');

                this.decorations.forEach((d, i) => {
                    if (STATE.mode === 'TREE') {
                        const t = i / this.decorations.length;
                        if (d.type !== 'PHOTO') {
                            const radius = 20 * (1 - t);
                            const angle = t * 50 * Math.PI;
                            d.targetPos.set(Math.cos(angle) * radius, t * 40 - 20, Math.sin(angle) * radius);
                            d.targetScale = d.type === 'DUST' ? 1 : 0.85;
                        } else {
                            const idx = photos.indexOf(d);
                            const ang = (idx / photos.length) * Math.PI * 2;
                            d.targetPos.set(Math.cos(ang) * 18, Math.sin(ang) * 18 + 10, 2);
                            d.targetScale = 0.45;
                        }
                    }
                    else if (STATE.mode === 'SCATTER') {
                        if (!d._scatterPos) {
                            const r = 10 + Math.random() * 15;
                            d._scatterPos = new THREE.Vector3().setFromSphericalCoords(r, Math.random()*Math.PI, Math.random()*Math.PI*2);
                        }
                        d.targetPos.copy(d._scatterPos);
                        d.targetScale = d.type === 'PHOTO' ? 0.9 : 0.7;
                    }
                    else if (STATE.mode === 'FOCUS') {
                        if (!STATE.focusedPhoto) STATE.focusedPhoto = photos[Math.floor(Math.random() * photos.length)];
                        if (d === STATE.focusedPhoto) {
                            d.targetPos.set(0, 2, 35);
                            d.targetScale = 4.5;
                        } else {
                            const ang = (i / this.decorations.length) * Math.PI * 2;
                            d.targetPos.set(Math.cos(ang) * 45, Math.sin(ang) * 35, -25);
                            d.targetScale = 0.15;
                        }
                    }
                    d.update();
                });

                // 光环动画
                this.auraGroup.children.forEach((ring, i) => {
                    ring.rotation.z += 0.01 * (i + 1);
                    const pulse = Math.sin(STATE.time * 2 + i) * 0.1 + 1;
                    ring.scale.set(pulse * (1 + i * 0.2), pulse * (1 + i * 0.2), 1);
                    ring.visible = STATE.mode === 'TREE';
                });
            }

            animate() {
                STATE.time = performance.now() * 0.001;
                requestAnimationFrame(() => this.animate());
                this.updateLayout();
                this.mainGroup.rotation.y = THREE.MathUtils.lerp(this.mainGroup.rotation.y, STATE.targetRotation.y, 0.08);
                this.mainGroup.rotation.x = THREE.MathUtils.lerp(this.mainGroup.rotation.x, STATE.targetRotation.x, 0.08);
                this.composer.render();
            }
        }

        // --- CV 逻辑 ---
        async function setupCV() {
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
            const handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO", numHands: 1
            });

            const video = document.getElementById('webcam');
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            video.srcObject = stream;

            const detect = async () => {
                const results = handLandmarker.detectForVideo(video, performance.now());
                if (results.landmarks && results.landmarks.length > 0) {
                    const lms = results.landmarks[0];
                    const wrist = lms[0];
                    const thumb = lms[4];
                    const index = lms[8];

                    const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
                    const tipsDist = [8, 12, 16, 20].reduce((s, id) => s + Math.hypot(lms[id].x - wrist.x, lms[id].y - wrist.y), 0) / 4;

                    if (pinchDist < 0.05) {
                        if(STATE.mode !== 'FOCUS') { STATE.mode = 'FOCUS'; STATE.focusedPhoto = null; }
                    } else if (tipsDist < 0.25) {
                        STATE.mode = 'TREE';
                    } else if (tipsDist > 0.42) {
                        STATE.mode = 'SCATTER';
                    }

                    STATE.targetRotation.y = (lms[9].x - 0.5) * 2.5;
                    STATE.targetRotation.x = (lms[9].y - 0.5) * 2.5;
                }
                requestAnimationFrame(detect);
            };
            video.onloadeddata = detect;
        }

        // 启动应用
        const app = new ChristmasScene();
        setupCV().then(() => {
            const loader = document.getElementById('loader');
            loader.style.opacity = '0';
            setTimeout(() => loader.remove(), 1000);
        });

    </script>
</body>
</html>
